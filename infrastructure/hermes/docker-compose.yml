# Hermes stack for vn-market-mcp (gateway + MCP venv init + dashboard). Kept in this repo so a new
# machine can rebuild it; derived from github.com/DeployFaith/hermes-docker-compose plus the
# mcp-venv-init service and the vn-market-mcp network/mount. Same project name as the original
# checkout, so on this machine it manages the very same containers.
#   cd infrastructure/hermes && docker compose up -d     (or: docker compose -f infrastructure/hermes/docker-compose.yml up -d)
# Settings (HERMES_IMAGE, HERMES_DATA_DIR, VN_MARKET_MCP_DIR, GATEWAY_PORT, DASHBOARD_PORT) come from
# infrastructure/hermes/.env, see .env.example; the defaults below are the original single-host setup.
name: hermes-docker-compose

# Pinned by digest (Hermes Agent v0.21.5, 2026.9.24), not :latest: a recreate must never pull a new Hermes
# by surprise (v0.21 started refusing the old dashboard flags). Upgrade on purpose: set HERMES_IMAGE in .env.
x-hermes-image: &hermes-image ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db}

services:
  # ---------------------------------------------------------------------------
  # MCP venv init — builds the vn-market-mcp dependency venv (incl. vnstock)
  # on the data volume before the gateway starts, so run-vn-market-mcp has a
  # reproducible environment instead of a hand-built one. Exits when done.
  # ---------------------------------------------------------------------------
  mcp-venv-init:
    image: *hermes-image
    container_name: hermes-mcp-venv-init
    entrypoint: ["/bin/sh", "/opt/vn-market-mcp/ops/setup_venv.sh"]
    volumes:
      - ${HERMES_DATA_DIR:-${HOME:-/root}/.hermes}:/opt/data
      - ${VN_MARKET_MCP_DIR:-../..}:/opt/vn-market-mcp:ro
    restart: "no"

  # ---------------------------------------------------------------------------
  # Hermes Gateway — core agent runtime & API
  # ---------------------------------------------------------------------------
  gateway:
    image: *hermes-image
    container_name: hermes-gateway
    command: gateway run
    restart: unless-stopped
    depends_on:
      mcp-venv-init:
        condition: service_completed_successfully
    ports:
      - "${GATEWAY_PORT:-8642}:8642"
    volumes:
      - ${HERMES_DATA_DIR:-${HOME:-/root}/.hermes}:/opt/data
      - ${VN_MARKET_MCP_DIR:-../..}:/opt/vn-market-mcp:ro
    shm_size: 1g
    networks:
      - hermes-net
      - vn-market-mcp_default
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Hermes Dashboard — web UI for managing the agent
  # ---------------------------------------------------------------------------
  dashboard:
    image: *hermes-image
    container_name: hermes-dashboard
    # Hermes refuses a non-loopback bind without an auth provider (--insecure is a no-op since v0.21), so the
    # dashboard listens on the host's loopback only: open it through an SSH or Tailscale tunnel to that port.
    # Same data dir as the gateway, so it shows the real profiles, sessions and cron.
    command: dashboard --host 127.0.0.1 --port ${DASHBOARD_PORT:-9120} --no-open
    network_mode: host
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ${HERMES_DATA_DIR:-${HOME:-/root}/.hermes}:/opt/data
    environment:
      GATEWAY_HEALTH_URL: http://127.0.0.1:${GATEWAY_PORT:-8642}

  # ---------------------------------------------------------------------------
  # Watchtower (opt-in) — auto-update hermes containers
  # ---------------------------------------------------------------------------
  # Uncomment the block below to enable automatic image updates via Watchtower.
  # It will watch every container on this compose project and pull new images
  # when available, then restart them seamlessly.
  #
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: hermes-watchtower
  #   restart: unless-stopped
  #   command: --label-enable --cleanup
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - hermes-net

networks:
  hermes-net:
    driver: bridge
  vn-market-mcp_default:
    external: true
