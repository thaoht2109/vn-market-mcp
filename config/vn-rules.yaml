version: 1

extra_tickers:
  require_user_confirmation: true
  max_extra_tickers: 20
  max_new_tickers_per_hour: 5
  pause_after_idle_days: 90

coverage:
  min_price_history_days: 500
  min_avg_liquidity_value_20d: 5.0e9
  min_fundamental_quarters: 4
  min_weight_coverage: 0.70

tier_b:
  confidence_cap: 0.6
  allow_buy_label_min_graded_samples: 30

action_labels:
  min_confidence_floor: 0.3
  buy_accumulate:
    min_score: 70
    min_confidence: 0.6
    min_agreeing_sources: 3
    min_rr: 2.0
    max_valuation_percentile: 70
  watch:
    min_score: 55
  reduce_exit:
    max_score: 40

weights:
  long:
    technical: 0.15
    flow: 0.10
    news_events: 0.15
    fundamental_valuation: 0.45
    sector_macro: 0.15

market_bands:
  HOSE: 0.07
  HNX: 0.10
  UPCOM: 0.15

lot_size: 100

price_unit_scale:
  # ponytail: hardcoded per-source scale factor, not a heuristic guesser.
  # Verify against Task 0 Step 4 findings; upgrade to per-source auto-detect
  # only if a second source is added with a different convention.
  VCI: 1
  TCBS: 1000
